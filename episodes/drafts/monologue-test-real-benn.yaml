  - id: fact_2
    type: talk
    text: >
      To be specific — the token that was exposed was a live GitHub administrator token.
      Meaning it didn't just unlock the camera.
      It unlocked the company's entire software repository.
      The source code. The infrastructure. All of it.
      From the login page of a camera that retails for about forty dollars.
    pause_after: 0.5

