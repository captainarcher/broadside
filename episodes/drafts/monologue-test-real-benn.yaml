scenes:

  - id: intro
    type: talk
    text: >
      Good evening. I'm Benn Stone.
      Before we begin, I want to say something about trust.
      When I ran my bar, I had a lock on the front door that you could open with a library card.
      Not a specific library card. Any library card.
      A man demonstrated this to me on a Tuesday.
      I thanked him. He ordered a beer. We never spoke of it again.
      That is how security worked at my establishment, and I thought that was the floor.
      I was wrong.
    pause_after: 1.0

  # --- MAIN BEAT: FACT 1 + REACTION ---

  - id: fact_1
    type: talk
    text: >
      A home security camera — the kind you buy to protect your home —
      shipped from the factory with a live administrator access token
      embedded directly in the code of its login page.
      A security researcher discovered this by opening the login page in a web browser
      and pressing F12.
      That's it. That's the whole heist.
    pause_after: 0.5

  - id: reaction_1
    type: talk
    # TOP PICK: Candidate 3
    text: >
      I want to be clear about what happened here.
      They sold a lock with the key taped to the front of the lock.
      Not hidden. Not around back. Taped to the front, label side out.
      I once left the register open overnight because the drawer stuck and I was tired.
      That is the most negligent thing I have ever done with a piece of hardware.
      I have now been surpassed by a publicly traded company.
    pause_after: 1.0
