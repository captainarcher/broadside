caption_hook: MIT is building AI surveillance tech and AI companies are hiding billions in debt — what could go wrong?
source_story:
  headline: MIT to become hotbed of AI video surveillance; AI companies hiding staggering debt
  source: hackernews
  url: https://www.schneier.com/blog/archives/2026/07/mit-to-become-hotbed-of-ai-video-surveillance.html
