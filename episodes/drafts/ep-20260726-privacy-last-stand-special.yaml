caption_hook: People are literally ripping surveillance cameras off poles and a mystery hacker embarrassed an entire spyware industry — and nobody's been caught.
source_story:
  headline: The growing vigilante movement to knock out Flock surveillance cameras / The hacker who humiliated spyware makers and was never caught
  source: hackernews
  url: https://www.theguardian.com/us-news/ng-interactive/2026/jul/25/flock-surveillance-cameras
  key_quotes:
    - Communities across the US have seen Flock Safety cameras destroyed, spray-painted, or physically removed from poles overnight.
