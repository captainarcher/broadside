  type: talk
  text: "Flock Safety has installed over a hundred thousand license plate readers across more than five thousand American communities. And some of those communities have responded with the most ancient form of tech criticism available. They're ripping them off the poles."
  pause_after: 1.0
  zoom: false
- id: setup
  type: talk
  text: "So here's where we are. Flock Safety — a company whose name sounds like a meditation app for sheep — sells automated license plate readers to police departments and HOAs. A hundred thousand cameras. Five thousand communities. Every car that drives by, logged, timestamped, searchable. They pitch it as neighborhood safety. Which, sure. That's also how you'd pitch a moat full of alligators if you were selling moats full of alligators. The product works exactly as described. People just disagree on whether the description is a feature list or a warning label."
  pause_after: 0.8
  zoom: false
- id: angle1
  type: talk
  text: "And so, according to The Guardian, a growing number of people have decided to handle this the old-fashioned way. Under cover of darkness, across multiple states, vigilantes are destroying Flock cameras. Spray paint. Bolt cutters. In some cases, just… yanking them off the pole. Which, I don't care where you stand on surveillance — that's a person who saw a forty-thousand-dollar piece of networked infrastructure and thought, yeah, I'm gonna fight that with my hands. That's not a policy position. That's a vibe. Police say they're investigating the vandalism, which is poetic, because the tool they'd normally use to investigate vandalism is the camera that got vandalized. And I have questions. Like, did no one at Flock think to point a Flock camera at their own Flock cameras? You've got a hundred thousand of them. Buddy, you could spare one."
  pause_after: 1.2
  zoom: true
- id: ad_break
  type: ad
  concept: ads/concepts/synctank.yaml
