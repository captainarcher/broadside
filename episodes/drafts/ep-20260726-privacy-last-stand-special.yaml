- id: angle2
  type: talk
  text: "Now. While some people are out there with bolt cutters and a dream, there's another front in this little resistance. TechCrunch profiled a hacker — unnamed, unidentified, uncaught — who breached multiple commercial spyware companies, dumped their internal documents, exposed their client lists, and then just… vanished. Gone. Like a browser tab you closed and can't find again. These are companies that sell surveillance tools to governments. Their entire product is knowing where people are and what they're doing. And one person walked into their systems, took everything, published it, and left no trace. That's like a locksmith getting locked out of his own house by a guy wearing a ski mask and rollerblades."
  pause_after: 1.0
  zoom: true
- id: callback
  type: talk
  text: "So let me get this straight. On one side, you've got people physically tearing cameras off telephone poles in the middle of the night. On the other, you've got a ghost in the machine humiliating billion-dollar spyware firms from a laptop that probably costs eight hundred bucks. Two completely different skill sets. One analog, one digital. United by a shared belief that the people watching everyone should maybe experience what it feels like to not see something coming. The surveillance industry spent years perfecting the art of watching. They just never practiced being watched back. Cool. Cool cool cool."
  pause_after: 1.0
  zoom: false
- id: closer
  type: talk
  text: "A hundred thousand cameras across five thousand communities, and the company still can't catch the people destroying them. A dozen spyware firms with tools that can crack any phone, and they still can't identify one hacker. Turns out the panopticon has a pretty significant blindspot. Itself."
  pause_after: 1.2
  zoom: true
