[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broadside"
version = "0.1.0"
description = "Automated video production pipeline for satirical news shows"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "replicate>=1.0",
    "elevenlabs>=1.0",
    "feedparser>=6.0",
    "newspaper4k>=0.9",
    "scikit-learn>=1.5",
    "tweepy>=4.14",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "playwright>=1.40",
    "faster-whisper>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
broadside = "broadside.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["broadside"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
